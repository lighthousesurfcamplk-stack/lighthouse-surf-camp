# =============================================================
#  Light House Surf Camp — admin configuration (Decap CMS)
# =============================================================
#  This file tells the admin panel what the owner is allowed to
#  edit. It maps 1:1 onto the JSON files in /content, which are
#  the single source of truth the website reads at runtime: four
#  for words and numbers, plus one media-*.json per page area
#  holding every photograph and the homepage background film.
#
#  IMPORTANT: the CMS rewrites each JSON file from the fields
#  declared below. Any key that is NOT declared here would be
#  silently deleted on the next save — which is why even the
#  "_note" reminders are declared as hidden fields.
# =============================================================

# -------------------------------------------------------------
#  BACKEND — pick ONE. Option A ships enabled.
# -------------------------------------------------------------
#  A) Netlify Identity + Git Gateway.
#     Best for a non-technical owner: they log in with an email
#     and password and never need a GitHub account.
backend:
  name: git-gateway
  branch: main

#  B) GitHub direct. Use this if you would rather log in with a
#     GitHub account, or if Identity is not available on your
#     Netlify site. Comment out block A, uncomment this, and see
#     "Option B" in ADMIN-GUIDE.md for the OAuth setup.
#
# backend:
#   name: github
#   repo: lighthousesurfcamplk-stack/lighthouse-surf-camp
#   branch: main
#   base_url: https://your-oauth-provider.netlify.app

# Local preview: run `npx decap-server` then open /admin on
# localhost — edits write straight to your working copy, no login.
local_backend: true

# -------------------------------------------------------------
#  MEDIA
# -------------------------------------------------------------
#  Uploads land in the same folder the site already serves from,
#  and are written into the JSON as "assets/img/<file>.jpg" —
#  exactly the relative path the pages expect.
media_folder: "assets/img"
public_folder: "assets/img"

# Every save is committed straight to main and goes live on the
# next deploy. Switch to "editorial_workflow" if you would rather
# review changes as drafts before they publish.
publish_mode: simple

site_url: https://lighthousesurfcamp.lk
display_url: https://lighthousesurfcamp.lk
logo_url: https://lighthousesurfcamp.lk/assets/img/favicon.svg

collections:
  # ===========================================================
  #  1. CAMP PACKAGES — the big cards on the booking page
  # ===========================================================
  - name: "packages"
    label: "Camp Packages"
    description: "The headline packages guests see first when they book."
    files:
      - name: "packages"
        label: "Camp Packages"
        file: "content/packages.json"
        description: >-
          Drag to reorder — the order here is the order guests see.
          Untick "Show on the website" to retire a package without
          deleting it.
        fields:
          - label: "Packages"
            name: "items"
            widget: "list"
            label_singular: "Package"
            summary: "{{fields.name}} — {{fields.price}} {{fields.unit}}"
            collapsed: true
            fields:
              - label: "Internal ID"
                name: "id"
                widget: "string"
                hint: >-
                  Never change this once a package is live — the booking
                  cart and the website both look packages up by ID.
                  Lowercase letters, numbers and dashes only.
                pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and dashes only — e.g. pkg-family-week"]
              - label: "Name"
                name: "name"
                widget: "string"
                hint: "Shown as the card heading, e.g. 7-Day Surf Camp."
              - label: "Short line under the name"
                name: "tagline"
                widget: "string"
                required: false
                hint: "e.g. All-inclusive · 6 nights"
              - label: "Price"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "Numbers only — no $ sign. The site adds the currency."
              - label: "Price applies…"
                name: "unit"
                widget: "select"
                options: ["per person", "per night", "per session", "per day", "per week", "total"]
                default: "per person"
              - label: "Photo"
                name: "image"
                widget: "image"
                media_library: { config: { multiple: false } }
                hint: "Landscape photos look best. Upload at least 1400px wide."
              - label: "Photo description"
                name: "alt"
                widget: "string"
                hint: >-
                  Describe the photo in a few words. Screen readers read this
                  aloud, and Google uses it to understand the image.
              - label: "Description"
                name: "blurb"
                widget: "text"
                hint: "Two or three sentences. Write it the way you would say it to a guest."
              - label: "What's included"
                name: "includes"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
                hint: "One line each. These appear as the ticked list on the card."
              - label: "Highlight as 'Most popular'"
                name: "featured"
                widget: "boolean"
                default: false
                hint: "Tick one package only — it gets the gold border and badge."
              - label: "Show on the website"
                name: "active"
                widget: "boolean"
                default: true

  # ===========================================================
  #  2. ROOMS, LESSONS & TREATMENTS — the à la carte catalogue
  # ===========================================================
  - name: "experiences"
    label: "Rooms, Lessons & Treatments"
    description: "Everything a guest can add individually under 'Build Your Own'."
    files:
      - name: "experiences"
        label: "Rooms, Lessons & Treatments"
        file: "content/experiences.json"
        fields:
          - label: "Tabs"
            name: "categories"
            widget: "list"
            label_singular: "Tab"
            collapsed: true
            summary: "{{fields.label}}"
            hint: >-
              The tabs across the top of "Build Your Own". Only change these
              if you are also updating the Tab field on every item below.
            fields:
              - label: "Tab ID"
                name: "id"
                widget: "string"
                pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and dashes only"]
              - label: "Tab name"
                name: "label"
                widget: "string"
              - label: "Small note under the tab"
                name: "note"
                widget: "string"
                required: false
              - label: "Quantity word"
                name: "unitWord"
                widget: "string"
                hint: "Shown next to the +/− control, e.g. Nights, People, Sessions."

          - label: "Items"
            name: "items"
            widget: "list"
            label_singular: "Item"
            collapsed: true
            summary: "{{fields.name}} — {{fields.price}} ({{fields.category}})"
            fields:
              - label: "Internal ID"
                name: "id"
                widget: "string"
                hint: >-
                  Never change this once it is live. Prefix it with the tab,
                  e.g. stay-treehouse, surf-lesson-single, well-yoga.
                pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and dashes only"]
              - label: "Tab"
                name: "category"
                widget: "select"
                options:
                  - { label: "Stay", value: "stay" }
                  - { label: "Surf", value: "surf" }
                  - { label: "Wellness", value: "wellness" }
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Short line under the name"
                name: "meta"
                widget: "string"
                required: false
                hint: "e.g. Sea view · sleeps 2"
              - label: "Price"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "Numbers only — no $ sign."
              - label: "Price applies…"
                name: "unit"
                widget: "select"
                options: ["per night", "per person", "per session", "per day", "per week", "total"]
                default: "per night"
              - label: "Photo"
                name: "image"
                widget: "image"
                media_library: { config: { multiple: false } }
              - label: "Photo description"
                name: "alt"
                widget: "string"
              - label: "Show on the website"
                name: "active"
                widget: "boolean"
                default: true

  # ===========================================================
  #  3. GUEST REVIEWS
  # ===========================================================
  - name: "reviews"
    label: "Guest Reviews"
    description: "The testimonials shown on the reviews page and the homepage."
    files:
      - name: "reviews"
        label: "Guest Reviews"
        file: "content/reviews.json"
        fields:
          - { label: "Reminder", name: "_note", widget: "hidden" }
          - label: "Reviews"
            name: "items"
            widget: "list"
            label_singular: "Review"
            collapsed: true
            summary: "{{fields.name}} — {{fields.origin}}"
            hint: >-
              Only publish reviews a real guest actually gave you. These feed
              the star rating Google shows in search results, and inventing
              them breaks Google's policy as well as consumer-protection law
              in most of your guests' home countries.
            fields:
              - { label: "Guest name", name: "name", widget: "string", hint: "First name and initial is plenty, e.g. Lena M." }
              - { label: "Country · what they booked", name: "origin", widget: "string", hint: "e.g. Germany · Beginner Course" }
              - label: "Stars"
                name: "stars"
                widget: "number"
                value_type: "int"
                min: 1
                max: 5
                default: 5
              - { label: "Review", name: "text", widget: "text" }
              - label: "Show on the homepage"
                name: "featured"
                widget: "boolean"
                default: false
                hint: "Three featured reviews appear on the homepage. The rest live on the reviews page."

  # ===========================================================
  #  4. IMAGES & VIDEO — every photograph on the public site
  # ===========================================================
  #  One entry per page area. Each maps to content/media-<name>.json,
  #  which the pages read at runtime through data-cms="media:…" hooks
  #  in the HTML — so changing a picture here changes it on the live
  #  site with no code edit and no rebuild.
  #
  #  The JSON files were seeded FROM the current markup, so on day one
  #  every field already holds the photo that is on the page now. Your
  #  first save changes nothing visually; it just puts the site's
  #  pictures under your control.
  #
  #  Two rules worth knowing:
  #   • Leave a photo field empty and the page keeps the picture it
  #     shipped with. Nothing ever breaks by being blank.
  #   • "Photo description" is the alt text. Screen readers read it
  #     aloud and Google uses it to understand the image, so it is
  #     worth writing properly. On the Russian, German, Hebrew and
  #     other translated pages the site keeps its own translation of
  #     the description rather than showing your English one.
  # ===========================================================
  - name: "media"
    label: "Images & Video"
    description: "Swap any photograph on the site, and set the background film on the homepage."
    files:
      # ---------------------------------------------------------
      #  HOME PAGE
      # ---------------------------------------------------------
      - name: "media-home"
        label: "Home Page"
        file: "content/media-home.json"
        description: "The homepage: the hero film and slideshow, and every photo down the page."
        fields:
          - label: "Hero (top of the page)"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              # ---- BACKGROUND FILM ----------------------------------
              #  Optional and purely additive. With no film uploaded the
              #  three photographs below cross-fade exactly as they do
              #  today; upload one and it fades in over them and the
              #  slideshow stands down. If a phone refuses to autoplay
              #  (Low Power Mode does), that phone simply keeps the
              #  slideshow — visitors never see a black rectangle.
              - label: "Background film"
                name: "video"
                widget: "object"
                collapsed: false
                fields:
                  - label: "Desktop film (landscape)"
                    name: "videoDesktop"
                    widget: "file"
                    required: false
                    # Films are big and are not photographs — keep them out
                    # of the image library so the picture pickers above stay
                    # quick to scroll. The leading slash is the path in the
                    # repository; the line under it is the path written into
                    # the JSON, which is what the browser asks for.
                    media_folder: "/assets/video"
                    public_folder: "assets/video"
                    hint: >-
                      MP4 (H.264), landscape, about 1920×1080, 8–15 seconds,
                      no sound, under 5 MB. It loops silently behind the
                      headline. Leave empty to keep the photo slideshow.
                  - label: "Mobile film (portrait)"
                    name: "videoMobile"
                    widget: "file"
                    required: false
                    media_folder: "/assets/video"
                    public_folder: "assets/video"
                    hint: >-
                      MP4 (H.264), portrait, about 1080×1920, 8–15 seconds,
                      no sound, under 3 MB. Phones and narrow windows get
                      this one. Upload only one film and it is used on every
                      screen, so this is optional even if you do use video.
                  - label: "Still frame while the film loads"
                    name: "poster"
                    widget: "image"
                    required: false
                    media_library: { config: { multiple: false } }
                    hint: >-
                      Optional. A single frame from the film, held for the
                      instant before it starts. Leave empty and the hero
                      photograph covers that moment instead.

              # ---- HERO SLIDESHOW -----------------------------------
              #  &photo defines the two fields every photograph on this
              #  whole site uses — the file, and the sentence describing
              #  it. Every other picture below simply says `fields: *photo`
              #  instead of repeating them, so a change to the wording here
              #  reaches all of them at once.
              - label: "Slideshow photo 1"
                name: "slide1"
                widget: "object"
                fields: &photo
                  - label: "Photo"
                    name: "image"
                    widget: "image"
                    required: false
                    media_library: { config: { multiple: false } }
                    hint: "At least 1400px on the long edge. JPG, and please keep it under 500KB — big files make the page slow."
                  - label: "Photo description"
                    name: "alt"
                    widget: "string"
                    required: false
                    hint: >-
                      Describe the photo in a few words. Screen readers read
                      this aloud, and Google uses it to understand the image.
              - { label: "Slideshow photo 2", name: "slide2", widget: "object", fields: *photo }
              - { label: "Slideshow photo 3", name: "slide3", widget: "object", fields: *photo }

          - { label: "Our story — the wide photo", name: "story", widget: "object", fields: *photo }

          - label: "Where you sleep — the three room cards"
            name: "rooms"
            widget: "object"
            fields:
              - { label: "Card 1 — tree house cabana", name: "one", widget: "object", fields: *photo }
              - { label: "Card 2 — double cabana", name: "two", widget: "object", fields: *photo }
              - { label: "Card 3 — dorm bed", name: "three", widget: "object", fields: *photo }

          - { label: "Restaurant photo", name: "dining", widget: "object", fields: *photo }
          - { label: "Wellness photo", name: "wellness", widget: "object", fields: *photo }

          - label: "Photo band — the four small pictures in a row"
            name: "band"
            widget: "object"
            fields:
              - { label: "Band photo 1", name: "one",   widget: "object", fields: *photo }
              - { label: "Band photo 2", name: "two",   widget: "object", fields: *photo }
              - { label: "Band photo 3", name: "three", widget: "object", fields: *photo }
              - { label: "Band photo 4", name: "four",  widget: "object", fields: *photo }

          - { label: "The place — wide photo", name: "place", widget: "object", fields: *photo }
          - { label: "Closing banner (above the booking button)", name: "cta", widget: "object", fields: *photo }

          # Not shown in the admin. It is here only so the reminder inside
          # the JSON file survives your save — an undeclared key is deleted.
          - { label: "Note", name: "_note", widget: "hidden" }

      # ---------------------------------------------------------
      #  STAY PAGE
      # ---------------------------------------------------------
      - name: "media-stay"
        label: "Stay Page"
        file: "content/media-stay.json"
        description: "The rooms page: the banner, all seven room photos, and the photo band."
        fields:
          - { label: "Page banner", name: "hero", widget: "object", fields: *photo }
          - label: "Room photos"
            name: "rooms"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Tree House Cabana",       name: "one",   widget: "object", fields: *photo }
              - { label: "Triple Tree House Cabana",name: "two",   widget: "object", fields: *photo }
              - { label: "Single Cabana",           name: "three", widget: "object", fields: *photo }
              - { label: "Double Cabana",           name: "four",  widget: "object", fields: *photo }
              - { label: "Dorm bed",                name: "five",  widget: "object", fields: *photo }
              - { label: "Mountain Cabana",         name: "six",   widget: "object", fields: *photo }
              - { label: "Buffalo Rock Cabana",     name: "seven", widget: "object", fields: *photo }
          - label: "Photo band — the four small pictures in a row"
            name: "band"
            widget: "object"
            fields:
              - { label: "Band photo 1", name: "one",   widget: "object", fields: *photo }
              - { label: "Band photo 2", name: "two",   widget: "object", fields: *photo }
              - { label: "Band photo 3", name: "three", widget: "object", fields: *photo }
              - { label: "Band photo 4", name: "four",  widget: "object", fields: *photo }
          - { label: "Closing banner", name: "cta", widget: "object", fields: *photo }
          - { label: "Note", name: "_note", widget: "hidden" }

      # ---------------------------------------------------------
      #  SURF PAGES — lessons.html and rentals.html share one file
      # ---------------------------------------------------------
      - name: "media-surf"
        label: "Surf Pages"
        file: "content/media-surf.json"
        description: "Surf lessons and board rentals, including the nine surf-spot photos."
        fields:
          - label: "Surf Lessons page"
            name: "lessons"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Page banner",              name: "hero",    widget: "object", fields: *photo }
              - { label: "Wide photo beside the copy", name: "feature", widget: "object", fields: *photo }
              - { label: "Closing banner",           name: "cta",     widget: "object", fields: *photo }
          - label: "Surf spots — the nine break cards"
            name: "spots"
            widget: "object"
            fields:
              - { label: "Main Point",      name: "main",       widget: "object", fields: *photo }
              - { label: "Baby Point",      name: "baby",       widget: "object", fields: *photo }
              - { label: "Whisky Point",    name: "whisky",     widget: "object", fields: *photo }
              - { label: "Pottuvil Point",  name: "pottuvil",   widget: "object", fields: *photo }
              - { label: "Light House",     name: "lighthouse", widget: "object", fields: *photo }
              - { label: "Elephant Rock",   name: "elephant",   widget: "object", fields: *photo }
              - { label: "Peanut Farm",     name: "peanut",     widget: "object", fields: *photo }
              - { label: "Okanda",          name: "okanda",     widget: "object", fields: *photo }
              - { label: "Panama Point",    name: "panama",     widget: "object", fields: *photo }
          - label: "Board Rentals page"
            name: "rentals"
            widget: "object"
            fields:
              - { label: "Page banner",      name: "hero",       widget: "object", fields: *photo }
              - { label: "Board photo 1",    name: "boardOne",   widget: "object", fields: *photo }
              - { label: "Board photo 2",    name: "boardTwo",   widget: "object", fields: *photo }
              - { label: "Board photo 3",    name: "boardThree", widget: "object", fields: *photo }
              - { label: "Board photo 4",    name: "boardFour",  widget: "object", fields: *photo }
              - { label: "Closing banner",   name: "cta",        widget: "object", fields: *photo }
          - { label: "Note", name: "_note", widget: "hidden" }

      # ---------------------------------------------------------
      #  WELLNESS PAGE
      # ---------------------------------------------------------
      - name: "media-wellness"
        label: "Wellness Page"
        file: "content/media-wellness.json"
        description: "Ayurveda, yoga and sound healing."
        fields:
          - { label: "Page banner",                 name: "hero",  widget: "object", fields: *photo }
          - { label: "Section 1 — Ayurveda",        name: "one",   widget: "object", fields: *photo }
          - { label: "Section 2 — Yoga & breathwork", name: "two", widget: "object", fields: *photo }
          - { label: "Section 3 — Sound healing",   name: "three", widget: "object", fields: *photo }
          - { label: "Closing banner",              name: "cta",   widget: "object", fields: *photo }
          - { label: "Note", name: "_note", widget: "hidden" }

      # ---------------------------------------------------------
      #  THINGS TO DO PAGE
      # ---------------------------------------------------------
      - name: "media-explore"
        label: "Things To Do Page"
        file: "content/media-explore.json"
        description: "Safari, viewpoints, temples and the twelve excursion tiles."
        fields:
          - { label: "Page banner",                name: "hero",    widget: "object", fields: *photo }
          - { label: "Wide photo beside the copy", name: "feature", widget: "object", fields: *photo }
          - label: "The twelve tiles"
            name: "tiles"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Kumana National Park",  name: "kumana",       widget: "object", fields: *photo }
              - { label: "Elephant Rock",         name: "elephantRock", widget: "object", fields: *photo }
              - { label: "Pottuvil Lagoon",       name: "lagoon",       widget: "object", fields: *photo }
              - { label: "Kudumbigala Monastery", name: "kudumbigala",  widget: "object", fields: *photo }
              - { label: "Lahugala National Park",name: "lahugala",     widget: "object", fields: *photo }
              - { label: "Muhudu Maha Viharaya",  name: "muhudu",       widget: "object", fields: *photo }
              - { label: "Beach yoga",            name: "yoga",         widget: "object", fields: *photo }
              - { label: "Lagoon fishing",        name: "fishing",      widget: "object", fields: *photo }
              - { label: "Shopping",              name: "shopping",     widget: "object", fields: *photo }
              - { label: "Nightlife",             name: "nightlife",    widget: "object", fields: *photo }
              - { label: "Sri Lankan food",       name: "culinary",     widget: "object", fields: *photo }
              - { label: "Sunrise & sunset",      name: "sunrise",      widget: "object", fields: *photo }
          - { label: "Closing wide photo", name: "closing", widget: "object", fields: *photo }
          - { label: "Closing banner",     name: "cta",     widget: "object", fields: *photo }
          - { label: "Note", name: "_note", widget: "hidden" }

      # ---------------------------------------------------------
      #  ABOUT PAGE
      # ---------------------------------------------------------
      - name: "media-about"
        label: "About Page"
        file: "content/media-about.json"
        description: "The camp's story."
        fields:
          - { label: "Page banner",      name: "hero", widget: "object", fields: *photo }
          - { label: "Story photo 1",    name: "one",  widget: "object", fields: *photo }
          - { label: "Story photo 2",    name: "two",  widget: "object", fields: *photo }
          - { label: "Closing banner",   name: "cta",  widget: "object", fields: *photo }
          - { label: "Note", name: "_note", widget: "hidden" }

      # ---------------------------------------------------------
      #  GALLERY PAGE
      # ---------------------------------------------------------
      - name: "media-gallery"
        label: "Gallery Page"
        file: "content/media-gallery.json"
        description: "The full photo wall and the Instagram strip. Drag to reorder, or add and remove photos freely."
        fields:
          - { label: "Page banner", name: "hero", widget: "object", fields: *photo }
          # Unlike every other picture on the site these two are LISTS, so
          # you can add a photo, delete one, or drag the order around. The
          # page rebuilds itself from whatever is here.
          - label: "Photo wall"
            name: "photos"
            widget: "list"
            label_singular: "Photo"
            collapsed: true
            summary: "{{fields.alt}}"
            fields: *photo
            hint: >-
              The main gallery grid. Mix tall and wide photos — the wall is a
              masonry layout and reflows around whatever you give it.
          - label: "Instagram strip"
            name: "instagram"
            widget: "list"
            label_singular: "Tile"
            collapsed: true
            summary: "{{fields.alt}}"
            fields: *photo
            hint: >-
              The six square tiles at the foot of the page. Square-ish crops
              look best; they are cropped to a square either way.
          - { label: "Note", name: "_note", widget: "hidden" }

      # ---------------------------------------------------------
      #  PACKAGES, BOOKING & REVIEWS — one banner each
      # ---------------------------------------------------------
      - name: "media-pages"
        label: "Packages, Booking & Reviews"
        file: "content/media-pages.json"
        description: "The banners on the three remaining pages."
        fields:
          - label: "Packages page"
            name: "packages"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Page banner",              name: "hero",    widget: "object", fields: *photo }
              - { label: "Wide photo beside the copy", name: "feature", widget: "object", fields: *photo }
              - { label: "Closing banner",           name: "cta",     widget: "object", fields: *photo }
          - label: "Booking page"
            name: "book"
            widget: "object"
            fields:
              - { label: "Page banner", name: "hero", widget: "object", fields: *photo }
          - label: "Reviews page"
            name: "reviews"
            widget: "object"
            fields:
              - { label: "Page banner",    name: "hero", widget: "object", fields: *photo }
              - { label: "Closing banner", name: "cta",  widget: "object", fields: *photo }
          - { label: "Note", name: "_note", widget: "hidden" }

  # ===========================================================
  #  5. SITE SETTINGS
  # ===========================================================
  - name: "settings"
    label: "Site Settings"
    description: "Contact details, deposit rules, payment gateway and the numbers shown across the site."
    files:
      - name: "settings"
        label: "Site Settings"
        file: "content/settings.json"
        fields:
          - label: "Brand"
            name: "brand"
            widget: "object"
            fields:
              - { label: "Camp name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - label: "WhatsApp number"
                name: "whatsapp"
                widget: "string"
                pattern: ['^[0-9]{8,15}$', "Digits only, including the country code and no + — e.g. 94702828819"]
                hint: >-
                  Digits only, country code first, no + and no spaces.
                  Every "Chat on WhatsApp" button on the site uses this.
              - { label: "WhatsApp number as displayed", name: "whatsappDisplay", widget: "string", hint: "How it is printed on screen, e.g. +94 70 282 8819" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Instagram handle", name: "instagram", widget: "string", hint: "Without the @." }

          - label: "Booking rules"
            name: "booking"
            widget: "object"
            fields:
              - { label: "Currency code", name: "currency", widget: "string", default: "USD" }
              - { label: "Currency symbol", name: "currencySymbol", widget: "string", default: "$" }
              - label: "Deposit taken online"
                name: "depositRate"
                widget: "number"
                value_type: "float"
                min: 0
                max: 1
                step: 0.05
                hint: >-
                  As a decimal: 0.25 means guests pay 25% now and the balance
                  on arrival. Changing this instantly changes every quote.
              - { label: "Minimum notice (days)", name: "minNoticeDays", widget: "number", value_type: "int", min: 0 }
              - label: "Small print under the deposit"
                name: "note"
                widget: "text"
                hint: "Shown on the confirmation step. Keep your cancellation terms accurate here."

          - label: "Card payments (PayHere)"
            name: "payhere"
            widget: "object"
            collapsed: true
            fields:
              - label: "Accept card payments"
                name: "enabled"
                widget: "boolean"
                default: false
                hint: >-
                  Leave OFF until your PayHere account is approved and the
                  hash endpoint is deployed. While it is off, guests confirm
                  over WhatsApp instead — bookings still work.
              - label: "Sandbox (test) mode"
                name: "sandbox"
                widget: "boolean"
                default: true
                hint: "ON = test cards only, no real money. Turn OFF only when you are ready to take live payments."
              - { label: "Merchant ID", name: "merchantId", widget: "string", hint: "From your PayHere dashboard. This one is safe to publish — never put your Merchant SECRET here." }
              - { label: "Hash endpoint", name: "hashEndpoint", widget: "string" }
              - { label: "Return URL", name: "returnUrl", widget: "string" }
              - { label: "Cancel URL", name: "cancelUrl", widget: "string" }
              - { label: "Notify URL", name: "notifyUrl", widget: "string" }

          - { label: "Reminder", name: "_note", widget: "hidden" }

          - label: "Star rating"
            name: "rating"
            widget: "object"
            hint: "Published as structured data, so Google may show it in search results. Only enter figures you can evidence."
            fields:
              - { label: "Average rating", name: "value", widget: "string" }
              - { label: "Number of reviews", name: "count", widget: "string" }

          - label: "Trust badges"
            name: "trust"
            widget: "list"
            collapsed: true
            summary: "{{fields.label}} — {{fields.detail}}"
            fields:
              - { label: "Icon", name: "icon", widget: "string", hint: "A single emoji or symbol." }
              - { label: "Headline", name: "label", widget: "string" }
              - { label: "Detail", name: "detail", widget: "string" }

          - label: "Headline numbers"
            name: "stats"
            widget: "list"
            collapsed: true
            summary: "{{fields.value}} {{fields.label}}"
            hint: "The three big figures across the site. Only publish numbers you can back up."
            fields:
              - { label: "Number", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
